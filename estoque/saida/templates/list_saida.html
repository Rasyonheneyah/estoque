{% extends 'base.html' %}
{% block content %}
<h3 class="subtitle">Saída</h3>
<a class="button is-success mb-4" href="{% url 'saida:new_saida' %}">Novo</a>
<table class="table">
<thead>
    <tr>
        <th>Id</th>
        <th>Produto</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th></th>
    </tr>
</thead>
<tbody>
    {% for saida in saidas %}
    <tr>
        <th>{{ saida.id }}</th>
        <td>{{ saida.produto }}</td>
        <td class="textCentral">{{ saida.preco }}</td>
        <td class="textCentral">{{ saida.quantidade }}</td>
        <td><a class="button is-warning" href="{% url  'saida:update_saida' saida.id %}">alterar</a></td>
        <td><a class="button is-danger" href="{% url  'saida:delete_saida' saida.id %}">deletar</a></td>
    </tr>
    {% endfor %}
</tbody>
</table>
{% endblock %}
